version: '3.8'

services:
  ssih-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssih-student-hub
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=ssih_production_secure_secret_2026
    volumes:
      - ssih_data:/app/server/data

volumes:
  ssih_data:
